[package]
name = "desktop"
description = "Prática: app de prática de guitarra (Tauri)."
version.workspace = true
edition.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
practice-store = { path = "../../../crates/practice-store" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
audio-engine = { path = "../../../crates/audio-engine" }
# Motor NAM do painel Amp (mesma versão validada na bancada A0).
nam-rs = "=0.4.0"
# Prova do login do Spotify (PKCE com loopback).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
